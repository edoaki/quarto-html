<!doctype html><html lang="ja"><meta charset="utf-8">
<style>body{margin:0;color:#182b3a;font:20px 'Hiragino Sans','Yu Gothic',sans-serif}svg{width:100%;height:350px;display:block}text{fill:#182b3a}.heading{font-size:25px;font-weight:bold}.caption{font-size:19px}.route{fill:none;stroke:#007d88;stroke-width:4}.grid{fill:none;stroke:#c8d4d8;stroke-width:1}</style>
<svg viewBox="0 0 1152 350" role="img" aria-label="配送経路と3機械の加工順">
<text class="heading" x="18" y="30">配送経路</text><text class="heading" x="610" y="30">加工順（ジョブショップ）</text>
<rect x="18" y="48" width="500" height="205" rx="5" fill="#edf3f2"/><g id="route"></g><g id="homes"></g>
<rect x="45" y="130" width="35" height="30" fill="#007d88"/><path d="M40 130 L62 113 L85 130Z" fill="#007d88"/><text x="35" y="185">倉庫</text>
<g class="grid"><path d="M652 64V237H1110M652 120H1110M652 175H1110"/></g>
<text x="613" y="104">A</text><text x="613" y="158">B</text><text x="613" y="213">C</text>
<text x="650" y="259">0</text><text x="880" y="259">5</text><text x="1070" y="259">時間 →</text><g id="jobs"></g>
<text class="caption" x="18" y="282">決めるもの：訪問する順番</text><text class="caption" x="18" y="311">制約：すべての配送先を訪れる</text><text class="caption" x="18" y="340">目的：移動距離を短くする</text>
<text class="caption" x="610" y="282">決めるもの：各作業の開始時刻</text><text class="caption" x="610" y="311">制約：工程順・同じ機械の同時使用禁止</text><text class="caption" x="610" y="340">目的：すべての製品を早く完成させる</text>
</svg><script src="../../shared/frame.js"></script><script>
const pts=[[62,143],[160,83],[300,88],[460,130],[345,205],[160,213],[62,143]];
document.querySelector('#homes').innerHTML=pts.slice(1,-1).map(([x,y],i)=>`<path d="M${x-13} ${y}v18h26v-18l-13-13Z" fill="#9bbab6"/><text x="${x+20}" y="${y+17}">${i+1}</text>`).join('');
// [machine, start, duration, product]; each product obeys precedence, machines never overlap.
const jobs=[[0,0,2,0],[1,0,3,1],[2,0,2,2],[0,2,2,2],[2,3,1,1],[1,3,2,0],[0,4,2,1],[1,5,3,2],[2,5,2,0]];
const colors=['#007d88','#b66a3e','#7471b0'];
registerAnimation({steps:6,render(step){document.querySelector('#route').innerHTML=pts.slice(0,step).map((a,i)=>`<path class="route" d="M${a} L${pts[i+1]}"/>`).join('');document.querySelector('#jobs').innerHTML=jobs.slice(0,Math.ceil(step*1.5)).map(([m,t,d,j])=>`<rect x="${654+t*48}" y="${72+m*55}" width="${d*48-4}" height="37" rx="3" fill="${colors[j]}"/><text x="${662+t*48}" y="${98+m*55}" style="fill:white;font-size:17px">${d===1?'②':'製品'+(j+1)}</text>`).join('');}});
</script></html>
