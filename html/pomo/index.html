<!doctype html><html lang="ja"><meta charset="utf-8">
<style>body{margin:0;font:24px 'Hiragino Sans','Yu Gothic',sans-serif}svg{width:100%;height:350px}text{fill:#182b3a}.route{fill:none;stroke-width:4}</style>
<svg viewBox="0 0 1152 350" role="img" aria-label="異なる出発都市から候補経路を作り、平均を基準に学習する"><g id="routes"></g><text x="40" y="320" id="explanation"></text></svg>
<script src="../../shared/frame.js"></script><script>
const pts=[[40,120],[150,75],[245,160],[100,220]],routes=[[0,1,2,3,0],[1,3,0,2,1],[2,3,0,1,2]],colors=['#007d88','#b66a3e','#7471b0'];
registerAnimation({steps:4,render(step){document.querySelector('#routes').innerHTML=routes.map((r,k)=>`<g transform="translate(${k*380+15},0)"><text x="30" y="30">出発都市 ${r[0]+1}</text><path class="route" stroke="${colors[k]}" d="${r.slice(0,Math.min(step+1,5)).map((n,i)=>`${i?'L':'M'}${pts[n]}`).join(' ')}"/>${pts.map(([x,y],i)=>`<circle cx="${x}" cy="${y}" r="17" fill="${i===r[0]?colors[k]:'#d8e4e3'}"/><text x="${x-7}" y="${y+8}" style="fill:${i===r[0]?'white':'#182b3a'}">${i+1}</text>`).join('')}</g>`).join('');document.querySelector('#explanation').textContent=step<4?'出発点を変えて、複数の候補を構成する':'学習：複数経路の平均を基準に更新　／　推論：最短の候補を採用';}});
</script></html>
