<!doctype html><html lang="ja"><meta charset="utf-8">
<style>body{margin:0;font:23px 'Hiragino Sans','Yu Gothic',sans-serif;color:#182b3a}svg{width:100%;height:350px}text{fill:#182b3a}.hidden{visibility:hidden}.edge{stroke:#a2bfbc;stroke-width:2}.path{stroke:#007d88;stroke-width:5;fill:none}</style>
<svg viewBox="0 0 1152 350" role="img" aria-label="都市の座標から埋め込みを作り、訪問先を逐次選択する">
<text x="15" y="35">都市の座標</text><text x="370" y="35">エンコーダー</text><text x="785" y="35">デコーダー</text>
<g id="input"></g><text x="275" y="165" font-size="42">→</text><g id="encoder"><g id="edges"></g><g id="tokens"></g></g>
<text x="690" y="165" font-size="42">→</text><path id="path" class="path"/><g id="output"></g>
<text x="15" y="317">座標をトークンに変換</text><text x="365" y="317">都市同士の関係を埋め込む</text><text x="785" y="317">未訪問の都市から選ぶ</text>
</svg><script src="../../shared/frame.js"></script><script>
const points=[[35,125],[160,85],[220,200],[90,240]],seq=[0,1,2,3,0];
function nodes(dx,active){return points.map(([x,y],i)=>`<circle cx="${x+dx}" cy="${y}" r="20" fill="${active.includes(i)?'#007d88':'#d5e6e3'}"/><text x="${x+dx-7}" y="${y+8}" style="fill:${active.includes(i)?'white':'#182b3a'}">${i+1}</text>`).join('')}
document.querySelector('#input').innerHTML=nodes(0,[]);document.querySelector('#edges').innerHTML=points.flatMap(([x,y],i)=>points.slice(i+1).map(([xx,yy])=>`<line class="edge" x1="${x+365}" y1="${y}" x2="${xx+365}" y2="${yy}"/>`)).join('');document.querySelector('#tokens').innerHTML=nodes(365,[0,1,2,3]);
registerAnimation({steps:5,render(step){document.querySelector('#encoder').classList.toggle('hidden',step<1);document.querySelector('#output').innerHTML=nodes(780,seq.slice(0,step));document.querySelector('#path').setAttribute('d',step<2?'':seq.slice(0,step).map((i,k)=>`${k?'L':'M'}${points[i][0]+780},${points[i][1]}`).join(' '));}});
</script></html>
